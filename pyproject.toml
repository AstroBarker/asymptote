[project]
name = "asymptote"
version = "1.0.0"
description = "Core collapse supernova simulation asymptotic explosion energy estimator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emcee>=3.1.6",
    "corner>=2.2.2",
    "matplotlib>=3.9.2",
    "numpy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
